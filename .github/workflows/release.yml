name: Release MSIX

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore locked dependencies
        run: dotnet restore 'TokensLimitsExtension/TokensLimitsExtension.sln' --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true
      - name: Test release commit
        run: |
          dotnet build 'TokensLimitsExtension/TokensLimitsExtension.sln' --configuration Debug -p:Platform=x64 --no-restore -warnaserror
          dotnet test 'TokensLimitsExtension/TokensLimitsExtension.sln' --configuration Debug -p:Platform=x64 --no-restore --no-build
      - name: Validate tag and manifest version
        run: |
          [xml]$manifest = Get-Content 'TokensLimitsExtension/TokensLimitsExtension/Package.appxmanifest'
          [xml]$project = Get-Content 'TokensLimitsExtension/TokensLimitsExtension/TokensLimitsExtension.csproj'
          $version = $manifest.Package.Identity.Version
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $appxPackageVersion = @($project.Project.PropertyGroup | ForEach-Object AppxPackageVersion | Where-Object { $_ })[0]
          if ($projectVersion -ne $version -or $appxPackageVersion -ne $version) {
            throw "Manifest version $version does not match project version/AppxPackageVersion."
          }
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match manifest version $version."
          }
      - name: Restore signing certificate
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_PASSWORD)) {
            throw 'Release signing secrets are not configured.'
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\tokens-limits-release.pfx", [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          "PFX_PATH=$env:RUNNER_TEMP\tokens-limits-release.pfx" >> $env:GITHUB_ENV
      - name: Build signed packages
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:MSIX_CERTIFICATE_PASSWORD -AsPlainText -Force
          .\scripts\Build-Release.ps1 -CertificatePath $env:PFX_PATH -CertificatePassword $password
      - name: Validate release artifacts
        run: |
          [xml]$manifest = Get-Content 'TokensLimitsExtension/TokensLimitsExtension/Package.appxmanifest'
          $version = $manifest.Package.Identity.Version
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $expectedNames = @(
            "TokensLimitsExtension_${version}_x64.msix",
            "TokensLimitsExtension_${version}_ARM64.msix",
            'NFoxNet.TokensLimitsExtension.cer',
            'Install-TokensLimitsExtension.cmd',
            'Install-TokensLimitsExtension.ps1',
            'SHA256SUMS.txt')
          $actualNames = @(Get-ChildItem -LiteralPath $releaseDirectory -File | ForEach-Object Name | Sort-Object)
          $difference = Compare-Object -ReferenceObject ($expectedNames | Sort-Object) -DifferenceObject $actualNames
          if ($difference) {
            throw "Release artifacts differ from the allowlist: $($difference | Out-String)"
          }
          $checksumPath = Join-Path $releaseDirectory 'SHA256SUMS.txt'
          $checksumLines = @(Get-Content -LiteralPath $checksumPath)
          foreach ($name in $expectedNames | Where-Object { $_ -ne 'SHA256SUMS.txt' }) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $releaseDirectory $name) -Algorithm SHA256).Hash
            if ($checksumLines -notcontains "$hash *$name") {
              throw "SHA256SUMS.txt does not contain the current checksum for '$name'."
            }
          }
          & .\scripts\Test-ReleasePackage.ps1 `
            -PackagePath (Join-Path $releaseDirectory "TokensLimitsExtension_${version}_x64.msix") `
            -ExpectedVersion $version -ExpectedArchitecture x64 -ExpectedPublisher $manifest.Package.Identity.Publisher
          & .\scripts\Test-ReleasePackage.ps1 `
            -PackagePath (Join-Path $releaseDirectory "TokensLimitsExtension_${version}_arm64.msix") `
            -ExpectedVersion $version -ExpectedArchitecture arm64 -ExpectedPublisher $manifest.Package.Identity.Publisher
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*.msix
            artifacts/release/*.cer
            artifacts/release/*.txt
            artifacts/release/Install-TokensLimitsExtension.cmd
            artifacts/release/Install-TokensLimitsExtension.ps1
