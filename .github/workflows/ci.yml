name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: TokensLimitsExtension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: TokensLimitsExtension/**/packages.lock.json
      - run: dotnet restore .\TokensLimitsExtension.sln --locked-mode -p:Platform=x64 -p:PublishReadyToRun=true
      - name: Validate manifest and project versions
        run: |
          [xml]$manifest = Get-Content 'TokensLimitsExtension/Package.appxmanifest'
          [xml]$project = Get-Content 'TokensLimitsExtension/TokensLimitsExtension.csproj'
          $version = $manifest.Package.Identity.Version
          $projectVersion = @($project.Project.PropertyGroup | ForEach-Object Version | Where-Object { $_ })[0]
          $appxPackageVersion = @($project.Project.PropertyGroup | ForEach-Object AppxPackageVersion | Where-Object { $_ })[0]
          if ($projectVersion -ne $version -or $appxPackageVersion -ne $version) {
            throw "Manifest version $version does not match project version/AppxPackageVersion."
          }
      - run: dotnet build .\TokensLimitsExtension.sln --configuration Debug -p:Platform=x64 --no-restore -warnaserror
      - run: dotnet test .\TokensLimitsExtension.sln --configuration Debug -p:Platform=x64 --no-restore --no-build --logger "trx;LogFileName=debug-tests.trx" --results-directory .\TestResults
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-debug-test-results
          path: TokensLimitsExtension/TestResults/
          if-no-files-found: ignore

  release-build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    defaults:
      run:
        working-directory: TokensLimitsExtension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: TokensLimitsExtension/**/packages.lock.json
      - run: dotnet restore .\TokensLimitsExtension\TokensLimitsExtension.csproj --locked-mode -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=true
      - run: dotnet build .\TokensLimitsExtension\TokensLimitsExtension.csproj --configuration Release -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=${{ matrix.runtime }} --no-restore -warnaserror
