name: Bug report
description: Report a reproducible problem without exposing account secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, OAuth tokens, cookies, settings files or raw provider responses."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.0.2.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and PowerToys version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
